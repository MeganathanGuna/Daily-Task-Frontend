<div class="dashboard-container">

  <!-- Floating Header -->
  <div class="floating-header">
    <div class="header-left">
      <h1>Tasks Management</h1>
    </div>
    <div class="header-right">
      <div class="assigned-toggle-wrapper">
        <label class="toggle-switch">
          <input type="checkbox" [(ngModel)]="assignedFilterEnabled" (change)="toggleAssignedFilter()">
          <span class="slider"></span>
        </label>
        <span class="toggle-label">Assigned To Me</span>
      </div>
      <span class="welcome-text">Welcome, {{ userName }}</span>
      <button class="hamburger-btn" (click)="toggleMenu()">
        <i class="bi bi-list"></i>
      </button>
    </div>
  </div>

  <!-- Floating Dropdown Menu (EXACTLY like your reference) -->
  <div class="floating-menu" [class.open]="menuOpen">
    <button class="menu-item" routerLink="/specialization">
      <i class="bi bi-briefcase"></i> Specialization
    </button>
    <button class="menu-item" routerLink="/add-time">
      <i class="bi bi-clock-history"></i> Time Management
    </button>
    <button class="menu-item" (click)="openForm()">
      <i class="bi bi-plus-circle"></i> Add Task
    </button>
    <button class="menu-item" (click)="goHome()">
      <i class="bi bi-house-door-fill"></i> Home
    </button>
    <button class="menu-item logout" (click)="logout()">Logout</button>
  </div>

  <!-- Overlay when menu is open -->
  <div class="overlay" *ngIf="menuOpen" (click)="menuOpen = false"></div>

  

  <!-- Main Content -->
  <div class="content">
    

    <app-task-table
      [userName]="userName"
      [projectFilter]="selectedProject"
      [assignedFilterEnabled]="assignedFilterEnabled"
      (editRequested)="editRow($event)"
      (editTask)="editRow($event)">
    </app-task-table>
  </div>

  <div class="popup-overlay" *ngIf="showTaskForm" (click)="closeTaskModal()"></div>
<div class="modern-popup" *ngIf="showTaskForm">
  <!-- Header -->
  <div class="popup-header-modern">
    <h3 class="popup-title">
      {{ selectedRow ? 'Edit Task' : 'Add New Task' }}
    </h3>
    <button class="close-btn-modern" (click)="closeTaskModal()">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>

  <!-- Body -->
  <div class="popup-content">
    <app-task-form
      [existingData]="selectedRow"
      [selectedProject]="selectedProject"
      (formClosed)="closeTaskModal()"
      (taskSubmitted)="onTaskSubmitted()">
    </app-task-form>
  </div>
</div>
  
</div>
